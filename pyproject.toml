[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "B", "I","PL"]
ignore = ["E501"]  # remove to enforce line length

[tool.ruff.lint.isort]
known-first-party = ["gamesim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "gamesim"
version = "0.1.0"
description = "A simulation game created to for me to learn data engineering"
authors = [
    {name = "darius",email = "limhongyi1991@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.111)",
    "uvicorn[standard] (>=0.30)",
    "pydantic (>=2.7)",
    "pathlib (>=1.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
